plugins {
    id 'java'
    id 'checkstyle'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id "io.sentry.jvm.gradle" version "6.15.0"
}


sentry {
  includeSourceContext = true

  org = "ihorsavenko"
  projectName = "relay"
  authToken = System.getenv("SENTRY_AUTH_TOKEN")
}

group = 'com.veylor'
version = '0.0.1-SNAPSHOT'
description = 'relay'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(26)
    }
}

checkstyle {
    toolVersion = '10.15.0'
    ignoreFailures = true
    showViolations = true
}

repositories {
    mavenCentral()
}

ext {
    set('springModulithVersion', "2.1.0")
}

dependencies {
    implementation 'org.springframework.modulith:spring-modulith-starter-core'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
    testRuntimeOnly 'com.h2database:h2'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.modulith:spring-modulith-bom:${springModulithVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

bootRun {
    if (file("sentry-opentelemetry-agent-8.49.0.jar").exists()) {
        jvmArgs "-javaagent:sentry-opentelemetry-agent-8.49.0.jar"
        environment "SENTRY_AUTO_INIT", "false"
    }

    // Default OTEL exporters to 'none' to avoid localhost:4318 connection failures
    environment "OTEL_TRACES_EXPORTER", "none"
    environment "OTEL_METRICS_EXPORTER", "none"
    environment "OTEL_LOGS_EXPORTER", "none"

    // Load .env variables if the file exists (overriding defaults if defined there)
    if (file(".env").exists()) {
        file(".env").readLines().each { line ->
            line = line.trim()
            if (line && !line.startsWith("#")) {
                def parts = line.split("=", 2)
                if (parts.length == 2) {
                    def key = parts[0].trim()
                    def value = parts[1].trim()
                    if (value.length() >= 2 &&
                        ((value.startsWith('"') && value.endsWith('"')) ||
                         (value.startsWith("'") && value.endsWith("'")))) {
                        value = value.substring(1, value.length() - 1)
                    }
                    environment key, value
                }
            }
        }
    }
}

