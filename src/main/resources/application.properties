spring.application.name=rest_service

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:54321/veylor_relay}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

# Flyway Migration & JPA Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.jpa.hibernate.ddl-auto=update

# Java 21 Virtual Threads Support
spring.threads.virtual.enabled=true

# Admin Config
app.admin.secret-token=${ADMIN_SECRET_TOKEN:admin_dev_token_12345}

# Dynamic Mail Provider Configuration (Defaults to Mailpit)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.from-address=${MAIL_FROM_ADDRESS:relay@veylor.com}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQ:false}
