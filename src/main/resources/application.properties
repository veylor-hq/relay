spring.application.name=relay
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:54321/veylor_relay}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

# Connection Pool Tuning for Async Outbox
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# Flyway Migration & JPA Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.docker.compose.enabled=false

# Java 21 Virtual Threads Support
spring.threads.virtual.enabled=true

# Outbox Worker & Poller Settings
app.outbox.poller.enabled=${OUTBOX_POLLER_ENABLED:true}
app.outbox.poller.fixed-delay-ms=${OUTBOX_POLLER_DELAY:5000}
app.outbox.poller.batch-size=${OUTBOX_BATCH_SIZE:100}
app.outbox.max-retry-attempts=${OUTBOX_MAX_RETRIES:3}
app.outbox.rate-limit.emails-per-second=${OUTBOX_EMAILS_PER_SECOND:4.5}

# Admin & Security Config
app.admin.secret-token=${ADMIN_SECRET_TOKEN}
app.security.master-key=${MASTER_ENCRYPTION_KEY:veylor-relay-default-master-key-32b}

# Dynamic Mail Provider Configuration (Defaults to Mailpit)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.from-address=${MAIL_FROM_ADDRESS:contact@relay.dev}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:${MAIL_SMTP_AUTH:false}}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQ:${MAIL_SMTP_AUTH:false}}
# Added SMTP timeouts to prevent background worker threads from hanging indefinitely
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

